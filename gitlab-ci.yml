stages:
  - lint

eslint: # назва джоби
  stage: lint
  variables:
    NODE_VERSION: 26.13.1
  script: # steps - як в GitHub Actions
    - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.41.0/install.sh | bash
    - nvm install $NODE_VERSION
    - . "$NVM_DIR/nvm.sh"
    - npm install
    - npm run lint