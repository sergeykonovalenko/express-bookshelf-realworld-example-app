name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eslint:
    runs-on: node:26.13.1-alpine
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Dependencies
        run: npm ci

      - name: Lint source code with ESLint
        run: npm run lint

  prettier:
    runs-on: node:26.13.1-alpine
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Dependencies
        run: npm ci

      - name: Check source code with Prettier
        run: npm run check:format
