name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eslint:
    runs-on: ubuntu-latest
    container:
      image: node:26.13.1-alpine
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache node.js modules
        uses: actions/cache@v6.1.0
        env:
          cache-name: npm-${{ hashFiles('package-lock.json') }}
        with:
          path: ~/.npm
          key: ${{ env.cache-name }}
          restore-keys: |
            ${{ env.cache-name }}

      - name: Install Dependencies
        run: npm ci

      - name: Lint source code with ESLint
        run: npm run lint

  prettier:
    runs-on: ubuntu-latest
    container:
      image: node:26.13.1-alpine
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache node.js modules
        uses: actions/cache@v6.1.0
        env:
          cache-name: npm-${{ hashFiles('package-lock.json') }}
        with:
          path: ~/.npm
          key: ${{ env.cache-name }}
          restore-keys: |
            ${{ env.cache-name }}

      - name: Install Dependencies
        run: npm ci

      - name: Check source code with Prettier
        run: npm run check:format
