stages:
  - lint
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

eslint: # назва джоби
  image: node:26.13.1-alpine
  stage: lint
  script: # steps - як в GitHub Actions
    - npm install
    - npm run lint

prettier:
  image: node:26.13.1-alpine
  stage: lint
  script:
    - npm install
    - npm run check:format

deploy_backend:
  image: ubuntu:latest
  stage: deploy
  script:
    - apt -qq update && apt upgrade -qqy openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - scp . deploy@92.5.7.89:~/realworld
