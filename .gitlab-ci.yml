stages:
  - lint

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

eslint: # назва джоби
  image: node:26.13.1-alpine
  stage: lint
  script: # steps - як в GitHub Actions
    - npm install
    - npm run lint

prettier:
  image: node:26.13.1-alpine
  stage: lint
  script:
    - npm install
    - npm run check:format
