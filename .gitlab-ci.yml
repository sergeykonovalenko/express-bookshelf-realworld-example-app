stages:
  - lint
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.default-cache: &default-cache # ця строка називається anchor (якорь)
  before_script:
    - npm ci --cache .npm --prefer-offline

eslint: # назва джоби
  extends:
    - .default-cache
  image: node:26.13.1-alpine
  stage: lint
  script: # steps - як в GitHub Actions
    - npm install
    - npm run lint

prettier:
  extends:
    - .default-cache
  image: node:26.13.1-alpine
  stage: lint
  script:
    - npm install
    - npm run check:format

deploy_backend:
  image: ubuntu:latest
  stage: deploy
  script:
    - apt -qq update && apt upgrade -qqy openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - rsync -a --progress --human-readable --delete
      --exclude-from '.gitignore'
      --exclude .gitignore
      --exclude .git
      . deploy@92.5.7.89:~/realworld/
    - ssh deploy@92.5.7.89 "pushd ~/realworld && npm install && pm2 restart && popd"

